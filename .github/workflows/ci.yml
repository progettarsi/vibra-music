name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort -r | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (spotless)
        run: ./gradlew spotlessCheck --stacktrace

      # spotlessApply is excluded because the build otherwise rewrites what the check above read.
      - name: Build the app and run its unit tests
        run: >-
          ./gradlew
          :app:assembleGmsMobileUniversalDebug
          :app:testGmsMobileUniversalDebugUnitTest
          -x spotlessApply --stacktrace

      # A green run must mean the tests ran: a renamed variant would otherwise pass with none.
      - name: Check the unit tests really ran
        run: |
          RESULTS=app/build/test-results/testGmsMobileUniversalDebugUnitTest
          SUITES=$(find "$RESULTS" -name 'TEST-*.xml' 2>/dev/null | wc -l)
          TESTS=$(find "$RESULTS" -name 'TEST-*.xml' -exec grep -ho 'tests="[0-9]*"' {} + | tr -dc '0-9\n' | awk '{s+=$1} END {print s+0}')
          echo "::notice::$SUITES test suites, $TESTS tests"
          if [ "$SUITES" -lt 40 ]; then
            echo "::error::Expected at least 40 test suites, found $SUITES"
            exit 1
          fi

      # Known findings live in app/lint-baseline.xml: only new errors fail the run.
      - name: Lint (new errors only)
        run: ./gradlew :app:lintGmsMobileUniversalDebug -Pvibra.lintGate=true -x spotlessApply --stacktrace
