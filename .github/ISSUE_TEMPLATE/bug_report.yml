name: Bug report
description: Something in vibra isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: vibra version
      description: Settings → About, or the APK filename you installed
      placeholder: "1.6.0"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version / device
      placeholder: "Android 14, Pixel 7"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Anything that helps, like a screen recording or logcat output.
